<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo Bíblico em Contexto Judaico</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>Estudo Bíblico em Contexto Judaico</h1>
<p class="sub">Escolhe o livro, o capítulo e os versículos. O texto é carregado automaticamente.</p>

<div class="card">
  <label for="livro">Livro</label>
  <select id="livro"></select>
  <div class="row">
    <div><label for="cap">Capítulo</label><select id="cap"></select></div>
    <div><label for="v1">Versículo (de)</label><select id="v1"></select></div>
    <div><label for="v2">Até</label><select id="v2"></select></div>
  </div>
  <label for="trad">Tradução</label>
  <select id="trad">
    <option value="almeida">Almeida (português)</option>
    <option value="web">World English Bible</option>
    <option value="kjv">King James</option>
  </select>
  <label for="texto">Texto (opcional: podes editar ou colar o teu)</label>
  <textarea id="texto" placeholder="O texto aparece aqui..."></textarea>
  <div class="row2">
    <div><label for="chave">Chave de acesso</label><input id="chave" type="password" autocomplete="off"></div>
    <button id="go" type="button">Estudar</button>
  </div>
  <div id="status"></div>
  <div id="contacto" class="sub" style="font-size:.85rem"></div>
</div>

<div class="card" id="res" hidden>
  <h2 id="titulo"></h2>
  <div class="info" id="resumo"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panes"></div>
  <div class="dl">
    <button class="sec" id="dmd" type="button">Descarregar estudo (.md)</button>
    <button class="sec" id="dpdf" type="button">Descarregar estudo (.pdf)</button>
  </div>
</div>
</main>

<script>
const PT="Génesis|Êxodo|Levítico|Números|Deuteronómio|Josué|Juízes|Rute|1 Samuel|2 Samuel|1 Reis|2 Reis|1 Crónicas|2 Crónicas|Esdras|Neemias|Ester|Jó|Salmos|Provérbios|Eclesiastes|Cântico dos Cânticos|Isaías|Jeremias|Lamentações|Ezequiel|Daniel|Oseias|Joel|Amós|Obadias|Jonas|Miqueias|Naum|Habacuque|Sofonias|Ageu|Zacarias|Malaquias|Mateus|Marcos|Lucas|João|Atos|Romanos|1 Coríntios|2 Coríntios|Gálatas|Efésios|Filipenses|Colossenses|1 Tessalonicenses|2 Tessalonicenses|1 Timóteo|2 Timóteo|Tito|Filemom|Hebreus|Tiago|1 Pedro|2 Pedro|1 João|2 João|3 João|Judas|Apocalipse".split("|");
const EN="Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms|Proverbs|Ecclesiastes|Song of Solomon|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation".split("|");
const CH=[50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];

const $=id=>document.getElementById(id);
const livro=$("livro"),cap=$("cap"),v1=$("v1"),v2=$("v2"),trad=$("trad"),texto=$("texto"),st=$("status");
let versos=[],dados=null,passEstudo="";

function opts(sel,n){sel.innerHTML="";for(let i=1;i<=n;i++)sel.add(new Option(i,i));}
PT.forEach((n,i)=>livro.add(new Option(n,i)));
livro.value=39;
function setStatus(m,err){st.textContent=m;st.className=err?"err":"";}

async function carregarCapitulo(manter){
  const i=+livro.value;
  setStatus("A carregar o texto...");
  try{
    const r=await fetch(`https://bible-api.com/${encodeURIComponent(EN[i]+" "+cap.value)}?translation=${trad.value}`);
    if(!r.ok)throw 0;
    versos=(await r.json()).verses;
    const n=versos.length,a=manter?+v1.value:1,b=manter?+v2.value:a;
    opts(v1,n);opts(v2,n);
    v1.value=Math.min(a,n);v2.value=Math.min(Math.max(b,+v1.value),n);
    montarTexto();setStatus("");
  }catch(e){setStatus("Não foi possível carregar o texto. Cola o texto manualmente.",true);}
}
function montarTexto(){
  const a=+v1.value,b=Math.max(+v2.value,a);
  v2.value=b;
  texto.value=versos.filter(v=>v.verse>=a&&v.verse<=b).map(v=>v.verse+" "+v.text.trim()).join("\n");
}
function passagem(){
  const a=+v1.value,b=+v2.value;
  return `${PT[+livro.value]} ${cap.value}:${a}${b>a?"-"+b:""}`;
}
livro.onchange=()=>{opts(cap,CH[+livro.value]);cap.value=1;carregarCapitulo(false);};
cap.onchange=()=>carregarCapitulo(false);
trad.onchange=()=>carregarCapitulo(true);
v1.onchange=()=>{if(+v2.value<+v1.value)v2.value=v1.value;montarTexto();};
v2.onchange=()=>{if(+v2.value<+v1.value)v1.value=v2.value;montarTexto();};

/* ---------- Renderização ---------- */
const T=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cap1=k=>{k=k.replace(/_/g," ");return k.charAt(0).toUpperCase()+k.slice(1);};
function R(v){
  if(v==null||v==="")return "";
  if(typeof v==="string")return v.split(/\n+/).map(p=>`<p>${T(p)}</p>`).join("");
  if(Array.isArray(v))return "<ul>"+v.map(i=>"<li>"+(typeof i==="object"?Object.values(i).map(T).join(" — "):T(i))+"</li>").join("")+"</ul>";
  return Object.entries(v).map(([k,x])=>`<h4>${T(cap1(k))}</h4>`+R(x)).join("");
}
const B=(t,c)=>`<h3>${t}</h3>`+R(c);
function tabela(rows){
  if(!rows||!rows.length)return "";
  const cols=["palavra","original","transliteracao","significado"];
  return `<div class="scroll"><table><tr>${cols.map(c=>`<th>${cap1(c)}</th>`).join("")}</tr>`+
    rows.map(r=>"<tr>"+cols.map(c=>`<td>${T(r[c])}</td>`).join("")+"</tr>").join("")+"</table></div>";
}
function montarResultado(d,p){
  $("titulo").textContent=p;
  $("resumo").textContent=d.resumo||"";
  const ex=d.exegese||{};
  const panes=[
    ["Visão geral",B("Tema",d.tema)+B("Propósito",d.proposito)+B("Tipo literário",d.tipo_literario)+B("Autor, data e destinatários",d.autor_data_destinatarios)+B("Estrutura",d.estrutura)],
    ["Contexto judaico",B("Contexto histórico",d.contexto_historico)+B("Contexto judaico",d.contexto_judaico)],
    ["Exegese",B("Observações",ex.observacoes)+"<h3>Palavras-chave</h3>"+tabela(ex.palavras_chave)+B("Dificuldades e debates",ex.dificuldades)],
    ["Textos relacionados","<h3>Textos relacionados</h3><ul>"+(d.textos_relacionados||[]).map(t=>`<li><strong>${T(t.referencia)}</strong> — ${T(t.relacao)}</li>`).join("")+"</ul>"],
    ["Teologia e aplicação",B("Teologia",d.teologia)+B("Aplicação",d.aplicacao)+B("Perguntas para reflexão",d.perguntas)]
  ];
  $("tabs").innerHTML="";$("panes").innerHTML="";
  panes.forEach(([nome,html],i)=>{
    const b=document.createElement("button");b.textContent=nome;b.type="button";
    const pn=document.createElement("div");pn.className="pane";pn.innerHTML=html;
    b.onclick=()=>{[...$("tabs").children].forEach(x=>x.classList.remove("on"));[...$("panes").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");pn.classList.add("on");};
    $("tabs").appendChild(b);$("panes").appendChild(pn);
    if(i===0){b.classList.add("on");pn.classList.add("on");}
  });
  $("res").hidden=false;$("res").scrollIntoView({behavior:"smooth"});
}

/* ---------- Estudar ---------- */
$("go").onclick=async()=>{
  if(!$("chave").value){setStatus("Escreve a chave de acesso.",true);return;}
  $("go").disabled=true;setStatus("A preparar o estudo...");
  const p=passagem();
  try{
    const r=await fetch("/api/estudar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({passagem:p,texto:texto.value,chave:$("chave").value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||"Erro.");
    dados=d.dados;passEstudo=p;montarResultado(dados,p);setStatus("");
  }catch(e){setStatus(e.message,true);}
  $("go").disabled=false;
};

/* ---------- Downloads ---------- */
const nome=()=>"estudo_"+passEstudo.replace(/[^\w\-]+/g,"_");
function baixar(blob,fich){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fich;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
$("dmd").onclick=()=>{
  if(!dados)return;

  
  const l=[`# Estudo: ${passEstudo}\n`];
  for(const[k,v]of Object.entries(dados)){l.push("## "+cap1(k));l.push(typeof v==="string"?v:JSON.stringify(v,null,2));l.push("");}
  baixar(new Blob([l.join("\n")],{type:"text/markdown;charset=utf-8"}),nome()+".md");
};
$("dpdf").onclick=async()=>{
  if(!dados)return;
  $("dpdf").disabled=true;
  try{
    const r=await fetch("/api/pdf",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({passagem:passEstudo,dados,chave:$("chave").value})});
    if(!r.ok)throw new Error((await r.json()).detail||"Erro ao gerar o PDF.");
    baixar(await r.blob(),nome()+".pdf");
  }catch(e){setStatus(e.message,true);}
  $("dpdf").disabled=false;
};

/* ---------- Arranque ---------- */
fetch("/api/config").then(r=>r.json()).then(c=>{
  $("contacto").textContent="Para obter a chave de acesso, fala com o Teacher Pedro."+(c.contacto?" "+c.contacto:"");
}).catch(()=>{});
opts(cap,CH[39]);cap.value=5;
carregarCapitulo(false).then(()=>{v1.value=3;v2.value=3;montarTexto();});
</script>
</body>
</html>
